# Enrichment stage configuration.

# Input from Stage 1 — Normalization
annotations_path: ../../outputs/01_normalization/annotations.json
proteins_path: ../../outputs/01_normalization/proteins.json

# Output directory (shared with Stage 1)
output_root: ../../outputs

# API behaviour
api:
  # UniProt — no rate limit configurable here (handled in rate_limit.py)

  # InterPro
  interpro_page_size: 200      # entries per InterPro response (200 is plenty per protein)

# Scope
# 'all'              — all 1802 proteins (~1 min UniProt + ~6 min InterPro with 20 workers)
# 'poorly_annotated' — only 166 poorly annotated proteins (faster for testing)
scope: all